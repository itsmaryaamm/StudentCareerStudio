# Student Career Studio on Render (free web service + Render Postgres).
# Render dashboard -> New -> Blueprint -> this repo. No separate database signup.
# Fill every "sync: false" value when Render asks. Runbook: docs/beta/DEPLOY.md
services:
  - type: web
    name: student-career-studio
    runtime: docker
    plan: free # switch to starter (~$7/mo) to avoid 15-minute sleep and cold starts
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: CLIENT_IP_HEADER # Render sits behind Cloudflare, which sets this to the visitor's address; rate limits need it
        value: CF-Connecting-IP
      - key: PORT
        value: "3000"
      - key: DATABASE_URL # Render creates the database below and fills this in
        fromDatabase:
          name: scs-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_SECRET
        generateValue: true
      - key: STORAGE_BACKEND
        value: local # ephemeral on Render: profile pictures are lost on redeploy
      - key: GEMINI_API_KEY
        sync: false
      - key: SCS_BETA_MAX_USERS
        value: "50"
      - key: SCS_LIMIT_GLOBAL_AI_PER_DAY # about 90% of your real Google daily quota
        value: "450"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID # optional: Continue with Google
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: scs-db
    databaseName: scs
    plan: free # Render deletes free databases after 30 days: move to a paid plan (about $6/mo) before then, or export first
