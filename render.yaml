# Student Career Studio on Render (free web service + external Neon Postgres).
# Create the Neon database first, then: Render dashboard -> New -> Blueprint -> this repo.
# Fill every "sync: false" value when Render asks. Runbook: docs/beta/DEPLOY.md
services:
  - type: web
    name: student-career-studio
    runtime: docker
    plan: free # switch to starter (~$7/mo) to avoid 15-minute sleep and cold starts
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: PORT
        value: "3000"
      - key: DATABASE_URL # Neon pooled connection string, ending in ?sslmode=require
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_SECRET
        generateValue: true
      - key: STORAGE_BACKEND
        value: local # ephemeral on Render: profile pictures are lost on redeploy
      - key: GEMINI_API_KEY
        sync: false
      - key: SCS_BETA_INVITE_CODE
        sync: false
      - key: SCS_BETA_MAX_USERS
        value: "50"
      - key: SCS_LIMIT_GLOBAL_AI_PER_DAY # about 90% of your real Google daily quota
        value: "450"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID # optional: Continue with Google
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
